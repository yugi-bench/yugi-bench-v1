[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yugi-bench"
version = "0.1.0"
description = "A long-horizon tool-use benchmark for LLM agents on a deterministic Yu-Gi-Oh! rule engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "The yugi-bench authors" },
]
keywords = [
    "llm",
    "agents",
    "tool-use",
    "long-horizon-planning",
    "interactive-benchmark",
    "reinforcement-learning",
    "verifiable-rewards",
    "yugioh",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/yugi-bench/yugi-bench-v1"
Repository = "https://github.com/yugi-bench/yugi-bench-v1"
Issues = "https://github.com/yugi-bench/yugi-bench-v1/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["engine", "providers", "lib", "dataset"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
